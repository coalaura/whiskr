name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build frontend
        run: |
          cd static
          bun install
          bun run build
          test -d dist
          test -d internal

      - name: Stage frontend artifact
        run: |
          mkdir -p artifact/static
          cp -a static/dist artifact/static/dist
          cp -a static/internal artifact/static/internal

      - name: Upload frontend
        uses: actions/upload-artifact@v6
        with:
          name: frontend
          path: artifact
          if-no-files-found: error

  server:
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            zig_target: x86_64-linux-musl
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            zig_target: aarch64-linux-musl
            runner: ubuntu-latest
          - goos: windows
            goarch: amd64
            zig_target: x86_64-windows-gnu
            runner: ubuntu-latest
          - goos: windows
            goarch: arm64
            zig_target: aarch64-windows-gnu
            runner: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend
          path: .

      - name: Restore frontend layout
        run: |
          test -d static/dist
          test -d static/internal
          rm -rf public
          cp -a static/dist public

      - name: Set up Zig
        if: matrix.zig_target != ''
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Generate Windows resources
        if: matrix.goos == 'windows'
        run: |
          rm -f rsrc_*.syso *.syso
          go install github.com/tc-hib/go-winres@latest
          go-winres simply \
            --manifest cli \
            --product-name whiskr \
            --original-filename whiskr.exe \
            --icon public/favicon.ico \
            --copyright "(c) 2026 coalaura" \
            --file-description "Minimal LLM chat UI using OpenRouter giving you control over your context." \
            --file-version "${{ github.ref_name }}" \
            --arch "${{ matrix.goarch }}"

      - name: Build whiskr and proxy
        shell: bash
        run: |
          mkdir -p build
          EXT=""
          LDFLAGS=""
          [[ "${{ matrix.goos }}" == "windows" ]] && EXT=".exe"

          if [[ -n "${{ matrix.zig_target }}" ]]; then
            export CC="zig cc -target ${{ matrix.zig_target }}"
            export CXX="zig c++ -target ${{ matrix.zig_target }}"
            if [[ "${{ matrix.zig_target }}" == *"musl"* ]]; then
              LDFLAGS="-linkmode external -extldflags '-static'"
            fi
          fi

          GOOS=${{ matrix.goos }} \
          GOARCH=${{ matrix.goarch }} \
          CGO_ENABLED=1 \
          go build \
            -tags release \
            -trimpath \
            -buildvcs=false \
            -ldflags "-s -w -X 'main.Version=${{ github.ref_name }}' $LDFLAGS" \
            -o "build/whiskr${EXT}" .

          GOOS=${{ matrix.goos }} \
          GOARCH=${{ matrix.goarch }} \
          CGO_ENABLED=0 \
          go build \
            -tags release \
            -trimpath \
            -buildvcs=false \
            -ldflags "-s -w" \
            -o "build/whiskr_proxy${EXT}" ./cmd/proxy

      - name: Package
        shell: bash
        run: |
          [[ "${{ matrix.goos }}" == "windows" ]] && EXT=".exe" || EXT=""
          STAGE=build/stage
          mkdir -p "$STAGE"

          cp "build/whiskr${EXT}" "$STAGE/"
          cp "build/whiskr_proxy${EXT}" "$STAGE/"
          cp -r public "$STAGE/public"
          cp -r prompts "$STAGE/prompts"
          cp example.config.yml "$STAGE/config.yml"

          tar -czvf "build/whiskr_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" \
            -C "$STAGE" "whiskr${EXT}" "whiskr_proxy${EXT}" public prompts config.yml

          rm -rf "$STAGE" "build/whiskr${EXT}" "build/whiskr_proxy${EXT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: whiskr_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: build/*.tar.gz
          if-no-files-found: error

  desktop:
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            zig_target: x86_64-linux-musl
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            zig_target: aarch64-linux-musl
            runner: ubuntu-latest
          - goos: windows
            goarch: amd64
            zig_target: x86_64-windows-gnu
            runner: ubuntu-latest
          - goos: windows
            goarch: arm64
            zig_target: aarch64-windows-gnu
            runner: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend
          path: .

      - name: Restore frontend layout
        run: |
          test -d static/dist
          test -d static/internal
          rm -rf public
          cp -a static/dist public

      - name: Set up Zig
        if: matrix.zig_target != ''
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Generate Windows resources
        if: matrix.goos == 'windows'
        run: |
          rm -f rsrc_*.syso *.syso
          go install github.com/tc-hib/go-winres@latest
          go-winres simply \
            --manifest gui \
            --product-name whiskr \
            --original-filename whiskr_desktop.exe \
            --icon public/favicon.ico \
            --copyright "(c) 2026 coalaura" \
            --file-description "Minimal LLM chat UI using OpenRouter giving you control over your context." \
            --file-version "${{ github.ref_name }}" \
            --arch "${{ matrix.goarch }}"

      - name: Build whiskr desktop
        shell: bash
        run: |
          mkdir -p build
          EXT=""
          LDFLAGS=""
          [[ "${{ matrix.goos }}" == "windows" ]] && EXT=".exe"

          if [[ -n "${{ matrix.zig_target }}" ]]; then
            ZIG_FLAGS="-target ${{ matrix.zig_target }}"
            [[ "${{ matrix.goos }}" == "windows" ]] && ZIG_FLAGS="$ZIG_FLAGS -mwindows"
            export CC="zig cc $ZIG_FLAGS"
            export CXX="zig c++ $ZIG_FLAGS"

            if [[ "${{ matrix.zig_target }}" == *"musl"* ]]; then
              LDFLAGS="-linkmode external -extldflags '-static'"
            fi
          fi

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            LDFLAGS="$LDFLAGS -H=windowsgui"
            export CGO_LDFLAGS="${CGO_LDFLAGS:+$CGO_LDFLAGS }-mwindows"
          fi

          echo "CC=$CC"
          echo "CXX=$CXX"
          echo "CGO_LDFLAGS=$CGO_LDFLAGS"
          echo "LDFLAGS=$LDFLAGS"

          GOOS=${{ matrix.goos }} \
          GOARCH=${{ matrix.goarch }} \
          CGO_ENABLED=1 \
          go build \
            -tags desktop,release \
            -trimpath \
            -buildvcs=false \
            -ldflags "-s -w -X 'main.Version=${{ github.ref_name }}' $LDFLAGS" \
            -o "build/whiskr_desktop${EXT}" .

      - name: Verify Windows GUI subsystem
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          python3 - "build/whiskr_desktop.exe" <<'PY'
          import struct, sys
          path = sys.argv[1]
          with open(path, "rb") as f:
              if f.read(2) != b"MZ":
                  raise SystemExit(f"{path} is not a PE file")
              f.seek(0x3C)
              pe = struct.unpack("<I", f.read(4))[0]
              f.seek(pe)
              if f.read(4) != b"PE\0\0":
                  raise SystemExit(f"{path} is missing a PE header")
              # IMAGE_OPTIONAL_HEADER.Subsystem is at optional-header + 68
              f.seek(pe + 24 + 68)
              subsystem = struct.unpack("<H", f.read(2))[0]
          names = {2: "WINDOWS_GUI", 3: "WINDOWS_CUI"}
          print(f"{path}: subsystem={subsystem} ({names.get(subsystem, 'unknown')})")
          if subsystem != 2:
              raise SystemExit("desktop binary is WINDOWS_CUI; a console window will still appear")
          PY

      - name: Package
        shell: bash
        run: |
          [[ "${{ matrix.goos }}" == "windows" ]] && EXT=".exe" || EXT=""
          STAGE=build/stage
          mkdir -p "$STAGE"

          cp "build/whiskr_desktop${EXT}" "$STAGE/"
          cp -r prompts "$STAGE/prompts"
          cp example.config.yml "$STAGE/config.yml"

          tar -czvf "build/whiskr_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}_desktop.tar.gz" \
            -C "$STAGE" "whiskr_desktop${EXT}" prompts config.yml

          rm -rf "$STAGE" "build/whiskr_desktop${EXT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: whiskr_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}_desktop
          path: build/*.tar.gz
          if-no-files-found: error

  release:
    needs: [server, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: whiskr_*

      - name: Collect release archives
        run: |
          mkdir -p dist
          find artifacts -type f -name '*.tar.gz' -exec cp -v {} dist/ \;
          ls -la dist
          count=$(find dist -name '*.tar.gz' | wc -l)
          echo "archives: $count"
          test "$count" -eq 8

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
          name: "Release ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}