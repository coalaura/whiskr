name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build frontend
        shell: bash
        run: |
          set -euxo pipefail

          cd static
          bun install
          bun run build

          test -d dist
          test -d internal

      - name: Stage frontend artifact
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifact/static
          cp -a static/dist artifact/static/dist
          cp -a static/internal artifact/static/internal

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: artifact
          if-no-files-found: error

  server:
    name: Server · ${{ matrix.goos }} · ${{ matrix.goarch }}
    needs: frontend
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            zig_target: x86_64-linux-musl
            runner: ubuntu-latest

          - goos: linux
            goarch: arm64
            zig_target: aarch64-linux-musl
            runner: ubuntu-latest

          - goos: windows
            goarch: amd64
            zig_target: x86_64-windows-gnu
            runner: ubuntu-latest

          - goos: windows
            goarch: arm64
            zig_target: aarch64-windows-gnu
            runner: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend
          path: .

      - name: Restore frontend layout
        shell: bash
        run: |
          set -euxo pipefail

          test -d static/dist
          test -d static/internal

          rm -rf public
          cp -a static/dist public

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate Windows resources
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          set -euxo pipefail

          rm -f rsrc_*.syso *.syso

          go install github.com/tc-hib/go-winres@latest

          go-winres simply \
            --manifest cli \
            --product-name whiskr \
            --original-filename whiskr.exe \
            --icon public/favicon.ico \
            --copyright "(c) 2026 coalaura" \
            --file-description "Minimal LLM chat UI using OpenRouter giving you control over your context." \
            --file-version "${{ github.ref_name }}" \
            --arch "${{ matrix.goarch }}"

      - name: Build whiskr server and proxy
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p build

          EXT=""
          LDFLAGS=""

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            EXT=".exe"
          fi

          export CC="zig cc -target ${{ matrix.zig_target }}"
          export CXX="zig c++ -target ${{ matrix.zig_target }}"

          if [[ "${{ matrix.zig_target }}" == *"musl"* ]]; then
            LDFLAGS="-linkmode external -extldflags '-static'"
          fi

          GOOS="${{ matrix.goos }}" \
          GOARCH="${{ matrix.goarch }}" \
          CGO_ENABLED=1 \
          go build \
            -tags release \
            -trimpath \
            -buildvcs=false \
            -ldflags "-s -w -X 'main.Version=${{ github.ref_name }}' $LDFLAGS" \
            -o "build/whiskr${EXT}" .

          GOOS="${{ matrix.goos }}" \
          GOARCH="${{ matrix.goarch }}" \
          CGO_ENABLED=0 \
          go build \
            -tags release \
            -trimpath \
            -buildvcs=false \
            -ldflags "-s -w" \
            -o "build/whiskr_proxy${EXT}" ./cmd/proxy

      - name: Package server archive
        shell: bash
        run: |
          set -euxo pipefail

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            EXT=".exe"
          else
            EXT=""
          fi

          STAGE="build/stage"
          ARCHIVE="build/whiskr_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"

          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          cp "build/whiskr${EXT}" "$STAGE/"
          cp "build/whiskr_proxy${EXT}" "$STAGE/"
          cp -a public "$STAGE/public"
          cp -a prompts "$STAGE/prompts"
          cp example.config.yml "$STAGE/config.yml"

          tar -czvf "$ARCHIVE" \
            -C "$STAGE" \
            "whiskr${EXT}" \
            "whiskr_proxy${EXT}" \
            public \
            prompts \
            config.yml

          rm -rf "$STAGE"
          rm -f "build/whiskr${EXT}" "build/whiskr_proxy${EXT}"

      - name: Upload server archive
        uses: actions/upload-artifact@v7
        with:
          name: whiskr_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: build/*.tar.gz
          if-no-files-found: error

  desktop_linux:
    name: Desktop · Linux · ${{ matrix.goarch }}
    needs: frontend
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            zig_target: x86_64-linux-musl
            appimage_arch: x86_64

          - goarch: arm64
            zig_target: aarch64-linux-musl
            appimage_arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend
          path: .

      - name: Restore frontend layout
        shell: bash
        run: |
          set -euxo pipefail

          test -d static/dist
          test -d static/internal

          rm -rf public
          cp -a static/dist public

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build desktop binary
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p build

          export CC="zig cc -target ${{ matrix.zig_target }}"
          export CXX="zig c++ -target ${{ matrix.zig_target }}"

          GOOS=linux \
          GOARCH="${{ matrix.goarch }}" \
          CGO_ENABLED=1 \
          go build \
            -tags desktop,release \
            -trimpath \
            -buildvcs=false \
            -ldflags "-s -w -X 'main.Version=${{ github.ref_name }}' -linkmode external -extldflags=-static" \
            -o build/whiskr_desktop .

      - name: Build AppImage
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y python3-pil

          APPDIR="$PWD/build/Whiskr.AppDir"
          APPROOT="$APPDIR/usr/lib/whiskr"
          OUTPUT="$PWD/build/whiskr_${{ github.ref_name }}_linux_${{ matrix.goarch }}.AppImage"

          rm -rf "$APPDIR"
          mkdir -p \
            "$APPROOT/prompts" \
            "$APPDIR/usr/share/applications" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp build/whiskr_desktop "$APPROOT/whiskr_desktop"
          cp -a prompts/. "$APPROOT/prompts/"
          cp example.config.yml "$APPROOT/config.example.yml"

          chmod +x "$APPROOT/whiskr_desktop"

          cat > "$APPDIR/AppRun" <<'APP_RUN'
          #!/bin/sh
          set -eu

          APPDIR="$(dirname "$(readlink -f "$0")")"
          RESOURCE_DIR="$APPDIR/usr/lib/whiskr"

          export WHISKR_RESOURCE_DIR="$RESOURCE_DIR"

          cd "$RESOURCE_DIR"
          exec "$RESOURCE_DIR/whiskr_desktop" "$@"
          APP_RUN

          chmod +x "$APPDIR/AppRun"

          cat > "$APPDIR/whiskr.desktop" <<DESKTOP_FILE
          [Desktop Entry]
          Type=Application
          Name=Whiskr
          Comment=Minimal LLM chat UI using OpenRouter
          Exec=whiskr
          Icon=whiskr
          Terminal=false
          Categories=Network;Utility;
          StartupNotify=true
          X-AppImage-Version=${{ github.ref_name }}
          DESKTOP_FILE

          cp "$APPDIR/whiskr.desktop" \
            "$APPDIR/usr/share/applications/whiskr.desktop"

          python3 - \
            public/favicon.ico \
            "$APPDIR/whiskr.png" <<'PY'
          from pathlib import Path
          from PIL import Image
          import sys

          source = Path(sys.argv[1])
          destination = Path(sys.argv[2])

          with Image.open(source) as icon:
              if hasattr(icon, "ico"):
                  sizes = icon.ico.sizes()
                  largest = max(sizes, key=lambda size: size[0] * size[1])
                  image = icon.ico.getimage(largest).convert("RGBA")
              else:
                  image = icon.convert("RGBA")

          image.thumbnail((256, 256), Image.Resampling.LANCZOS)

          canvas = Image.new("RGBA", (256, 256), (0, 0, 0, 0))
          x = (256 - image.width) // 2
          y = (256 - image.height) // 2
          canvas.alpha_composite(image, (x, y))
          canvas.save(destination)
          PY

          cp "$APPDIR/whiskr.png" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps/whiskr.png"

          ln -s whiskr.png "$APPDIR/.DirIcon"

          curl \
            --fail \
            --location \
            --retry 5 \
            --output build/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage

          curl \
            --fail \
            --location \
            --retry 5 \
            --output build/appimage-runtime \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${{ matrix.appimage_arch }}"

          chmod +x build/appimagetool.AppImage
          chmod +x build/appimage-runtime

          ARCH="${{ matrix.appimage_arch }}" \
          APPIMAGE_EXTRACT_AND_RUN=1 \
          build/appimagetool.AppImage \
            --no-appstream \
            --runtime-file build/appimage-runtime \
            "$APPDIR" \
            "$OUTPUT"

          test -f "$OUTPUT"
          chmod +x "$OUTPUT"

      - name: Upload Linux desktop package
        uses: actions/upload-artifact@v7
        with:
          name: whiskr_${{ github.ref_name }}_linux_${{ matrix.goarch }}_desktop
          path: build/whiskr_${{ github.ref_name }}_linux_${{ matrix.goarch }}.AppImage
          if-no-files-found: error

  desktop_windows:
    name: Desktop · Windows · ${{ matrix.goarch }}
    needs: frontend
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            zig_target: x86_64-windows-gnu
            inno_arch: x64compatible
            inno_mode: x64compatible

          - goarch: arm64
            zig_target: aarch64-windows-gnu
            inno_arch: arm64
            inno_mode: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend
          path: .

      - name: Restore frontend layout
        shell: bash
        run: |
          set -euxo pipefail

          test -d static/dist
          test -d static/internal

          rm -rf public
          cp -a static/dist public

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Generate Windows resources
        shell: bash
        run: |
          set -euxo pipefail

          rm -f rsrc_*.syso *.syso

          go install github.com/tc-hib/go-winres@latest

          go-winres simply \
            --manifest gui \
            --product-name whiskr \
            --original-filename whiskr_desktop.exe \
            --icon public/favicon.ico \
            --copyright "(c) 2026 coalaura" \
            --file-description "Minimal LLM chat UI using OpenRouter giving you control over your context." \
            --file-version "${{ github.ref_name }}" \
            --arch "${{ matrix.goarch }}"

      - name: Build desktop binary
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p build

          export CC="zig cc -target ${{ matrix.zig_target }}"
          export CXX="zig c++ -target ${{ matrix.zig_target }}"

          GOOS=windows \
          GOARCH="${{ matrix.goarch }}" \
          CGO_ENABLED=1 \
          go build \
            -tags desktop,release \
            -trimpath \
            -buildvcs=false \
            -ldflags "-s -w -X 'main.Version=${{ github.ref_name }}' -H=windowsgui -linkmode=external -extldflags=-Wl,--subsystem,windows" \
            -o build/whiskr_desktop.exe .

      - name: Verify Windows GUI subsystem
        shell: bash
        run: |
          set -euxo pipefail

          python - build/whiskr_desktop.exe <<'PY'
          import struct
          import sys

          path = sys.argv[1]

          with open(path, "rb") as executable:
              if executable.read(2) != b"MZ":
                  raise SystemExit(f"{path} is not a PE file")

              executable.seek(0x3C)
              pe_offset = struct.unpack("<I", executable.read(4))[0]

              executable.seek(pe_offset)
              if executable.read(4) != b"PE\0\0":
                  raise SystemExit(f"{path} is missing a PE header")

              executable.seek(pe_offset + 24 + 68)
              subsystem = struct.unpack("<H", executable.read(2))[0]

          names = {
              2: "WINDOWS_GUI",
              3: "WINDOWS_CUI",
          }

          print(
              f"{path}: subsystem={subsystem} "
              f"({names.get(subsystem, 'unknown')})"
          )

          if subsystem != 2:
              raise SystemExit(
                  "desktop binary is WINDOWS_CUI; "
                  "a console window will still appear"
              )
          PY

      - name: Optionally sign Windows binary
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (
            [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX) -or
            [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          ) {
            Write-Warning "Windows signing secrets are not configured; the executable will be unsigned."
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "whiskr-signing.pfx"

          [System.IO.File]::WriteAllBytes(
            $certificatePath,
            [System.Convert]::FromBase64String(
              $env:WINDOWS_CERTIFICATE_PFX
            )
          )

          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
            -File |
            Sort-Object FullName |
            Select-Object -Last 1

          if ($null -eq $signTool) {
            throw "signtool.exe could not be found"
          }

          & $signTool.FullName sign `
            /fd SHA256 `
            /f $certificatePath `
            /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /tr "http://timestamp.digicert.com" `
            /td SHA256 `
            "build\whiskr_desktop.exe"

          if ($LASTEXITCODE -ne 0) {
            throw "Authenticode signing failed"
          }

      - name: Generate Inno Setup definition
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="${GITHUB_REF_NAME#v}"

          mkdir -p build/installer

          cat > build/whiskr.iss <<INNO_SETUP
          #define MyAppName "Whiskr"
          #define MyAppVersion "$VERSION"
          #define MyAppPublisher "coalaura"
          #define MyAppURL "https://github.com/coalaura/whiskr"
          #define MyAppExeName "whiskr_desktop.exe"
          #define RepoRoot GetEnv("GITHUB_WORKSPACE")

          [Setup]
          AppId={{4F189531-4D4D-4FD8-B35F-6CD9C98EC8E1}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          AppPublisherURL={#MyAppURL}
          AppSupportURL={#MyAppURL}
          AppUpdatesURL={#MyAppURL}
          DefaultDirName={localappdata}\Programs\Whiskr
          DefaultGroupName=Whiskr
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=${{ matrix.inno_arch }}
          ArchitecturesInstallIn64BitMode=${{ matrix.inno_mode }}
          MinVersion=10.0.17763
          OutputDir={#RepoRoot}\build\installer
          OutputBaseFilename=whiskr_${{ github.ref_name }}_windows_${{ matrix.goarch }}_setup
          SetupIconFile={#RepoRoot}\public\favicon.ico
          UninstallDisplayIcon={app}\{#MyAppExeName}
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          CloseApplications=yes
          RestartApplications=no
          SetupLogging=yes
          UsePreviousAppDir=yes
          ChangesAssociations=no

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"

          [InstallDelete]
          Type: filesandordirs; Name: "{app}\prompts"
          Type: files; Name: "{app}\config.example.yml"

          [Files]
          Source: "{#RepoRoot}\build\whiskr_desktop.exe"; DestDir: "{app}"; Flags: ignoreversion
          Source: "{#RepoRoot}\prompts\*"; DestDir: "{app}\prompts"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "{#RepoRoot}\example.config.yml"; DestDir: "{app}"; DestName: "config.example.yml"; Flags: ignoreversion

          [Icons]
          Name: "{autoprograms}\Whiskr"; Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"
          Name: "{autodesktop}\Whiskr"; Filename: "{app}\{#MyAppExeName}"; WorkingDir: "{app}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch Whiskr"; WorkingDir: "{app}"; Flags: nowait postinstall skipifsilent
          INNO_SETUP

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler"
          }

          & $compiler "build\whiskr.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed"
          }

      - name: Optionally sign Windows installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (
            [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX) -or
            [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          ) {
            Write-Warning "Windows signing secrets are not configured; the installer will be unsigned."
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "whiskr-signing.pfx"

          if (-not (Test-Path $certificatePath)) {
            [System.IO.File]::WriteAllBytes(
              $certificatePath,
              [System.Convert]::FromBase64String(
                $env:WINDOWS_CERTIFICATE_PFX
              )
            )
          }

          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
            -File |
            Sort-Object FullName |
            Select-Object -Last 1

          if ($null -eq $signTool) {
            throw "signtool.exe could not be found"
          }

          $installer = Get-ChildItem "build\installer\*.exe" |
            Select-Object -Single

          & $signTool.FullName sign `
            /fd SHA256 `
            /f $certificatePath `
            /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /tr "http://timestamp.digicert.com" `
            /td SHA256 `
            $installer.FullName

          if ($LASTEXITCODE -ne 0) {
            throw "Installer Authenticode signing failed"
          }

      - name: Upload Windows desktop installer
        uses: actions/upload-artifact@v7
        with:
          name: whiskr_${{ github.ref_name }}_windows_${{ matrix.goarch }}_desktop
          path: build/installer/*.exe
          if-no-files-found: error

  desktop_macos:
    name: Desktop · macOS · Universal
    needs: frontend
    runs-on: macos-15

    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend
          path: .

      - name: Restore frontend layout
        shell: bash
        run: |
          set -euxo pipefail

          test -d static/dist
          test -d static/internal

          rm -rf public
          cp -a static/dist public

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build universal desktop binary
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p build/macos

          build_arch() {
            local goarch="$1"
            local clang_arch="$2"
            local output="$3"

            GOOS=darwin \
            GOARCH="$goarch" \
            CGO_ENABLED=1 \
            CC=clang \
            CXX=clang++ \
            MACOSX_DEPLOYMENT_TARGET=11.0 \
            CGO_CFLAGS="-arch $clang_arch -mmacosx-version-min=11.0" \
            CGO_CXXFLAGS="-arch $clang_arch -mmacosx-version-min=11.0" \
            CGO_LDFLAGS="-arch $clang_arch -mmacosx-version-min=11.0" \
            go build \
              -tags desktop,release \
              -trimpath \
              -buildvcs=false \
              -ldflags "-s -w -X 'main.Version=${{ github.ref_name }}'" \
              -o "$output" .
          }

          build_arch amd64 x86_64 build/macos/whiskr_amd64
          build_arch arm64 arm64 build/macos/whiskr_arm64

          lipo \
            -create \
            build/macos/whiskr_amd64 \
            build/macos/whiskr_arm64 \
            -output build/macos/whiskr_desktop

          lipo -info build/macos/whiskr_desktop

      - name: Create macOS application bundle
        shell: bash
        run: |
          set -euxo pipefail

          APP="$PWD/build/Whiskr.app"
          CONTENTS="$APP/Contents"
          MACOS="$CONTENTS/MacOS"
          RESOURCES="$CONTENTS/Resources"
          VERSION="${GITHUB_REF_NAME#v}"

          rm -rf "$APP"

          mkdir -p \
            "$MACOS" \
            "$RESOURCES/prompts"

          cp build/macos/whiskr_desktop \
            "$RESOURCES/whiskr_desktop"

          cp -a prompts/. "$RESOURCES/prompts/"
          cp example.config.yml "$RESOURCES/config.example.yml"

          chmod +x "$RESOURCES/whiskr_desktop"

          cat > build/macos/launcher.c <<'C_LAUNCHER'
          #include <mach-o/dyld.h>
          #include <limits.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          int main(int argc, char **argv) {
              char executable[PATH_MAX];
              char resolved[PATH_MAX];
              char resources[PATH_MAX];
              char binary[PATH_MAX];
              uint32_t size = sizeof(executable);

              if (_NSGetExecutablePath(executable, &size) != 0) {
                  fprintf(stderr, "Unable to determine application path\n");
                  return 1;
              }

              if (realpath(executable, resolved) == NULL) {
                  perror("realpath");
                  return 1;
              }

              char *separator = strrchr(resolved, '/');
              if (separator == NULL) {
                  fprintf(stderr, "Invalid application path\n");
                  return 1;
              }

              *separator = '\0';

              if (snprintf(
                      resources,
                      sizeof(resources),
                      "%s/../Resources",
                      resolved
                  ) >= (int)sizeof(resources)) {
                  fprintf(stderr, "Application resource path is too long\n");
                  return 1;
              }

              if (realpath(resources, resources) == NULL) {
                  perror("realpath");
                  return 1;
              }

              if (snprintf(
                      binary,
                      sizeof(binary),
                      "%s/whiskr_desktop",
                      resources
                  ) >= (int)sizeof(binary)) {
                  fprintf(stderr, "Application binary path is too long\n");
                  return 1;
              }

              if (chdir(resources) != 0) {
                  perror("chdir");
                  return 1;
              }

              if (setenv("WHISKR_RESOURCE_DIR", resources, 1) != 0) {
                  perror("setenv");
                  return 1;
              }

              char **child_argv = calloc((size_t)argc + 1, sizeof(char *));
              if (child_argv == NULL) {
                  perror("calloc");
                  return 1;
              }

              child_argv[0] = binary;

              for (int index = 1; index < argc; index++) {
                  child_argv[index] = argv[index];
              }

              child_argv[argc] = NULL;

              execv(binary, child_argv);
              perror("execv");

              free(child_argv);
              return 1;
          }
          C_LAUNCHER

          clang \
            -arch x86_64 \
            -mmacosx-version-min=11.0 \
            build/macos/launcher.c \
            -o build/macos/launcher_amd64

          clang \
            -arch arm64 \
            -mmacosx-version-min=11.0 \
            build/macos/launcher.c \
            -o build/macos/launcher_arm64

          lipo \
            -create \
            build/macos/launcher_amd64 \
            build/macos/launcher_arm64 \
            -output "$MACOS/Whiskr"

          chmod +x "$MACOS/Whiskr"

          python3 - \
            "$CONTENTS/Info.plist" \
            "$VERSION" \
            "$GITHUB_RUN_NUMBER" <<'PY'
          import plistlib
          import sys

          path = sys.argv[1]
          version = sys.argv[2]
          build_number = sys.argv[3]

          info = {
              "CFBundleDevelopmentRegion": "en",
              "CFBundleDisplayName": "Whiskr",
              "CFBundleExecutable": "Whiskr",
              "CFBundleIconFile": "AppIcon",
              "CFBundleIdentifier": "io.github.coalaura.whiskr",
              "CFBundleInfoDictionaryVersion": "6.0",
              "CFBundleName": "Whiskr",
              "CFBundlePackageType": "APPL",
              "CFBundleShortVersionString": version,
              "CFBundleVersion": build_number,
              "LSApplicationCategoryType": (
                  "public.app-category.productivity"
              ),
              "LSMinimumSystemVersion": "11.0",
              "NSHighResolutionCapable": True,
          }

          with open(path, "wb") as plist:
              plistlib.dump(info, plist, sort_keys=False)
          PY

          mkdir -p build/AppIcon.iconset

          sips \
            -s format png \
            public/favicon.ico \
            --out build/AppIcon-source.png \
            >/dev/null

          create_icon() {
            local pixels="$1"
            local name="$2"

            sips \
              -z "$pixels" "$pixels" \
              build/AppIcon-source.png \
              --out "build/AppIcon.iconset/$name" \
              >/dev/null
          }

          create_icon 16 icon_16x16.png
          create_icon 32 icon_16x16@2x.png
          create_icon 32 icon_32x32.png
          create_icon 64 icon_32x32@2x.png
          create_icon 128 icon_128x128.png
          create_icon 256 icon_128x128@2x.png
          create_icon 256 icon_256x256.png
          create_icon 512 icon_256x256@2x.png
          create_icon 512 icon_512x512.png
          create_icon 1024 icon_512x512@2x.png

          iconutil \
            -c icns \
            build/AppIcon.iconset \
            -o "$RESOURCES/AppIcon.icns"

      - name: Configure macOS signing certificate
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$MACOS_CERTIFICATE_P12" || \
                -z "$MACOS_CERTIFICATE_PASSWORD" ]]; then
            echo "::warning::macOS signing certificate is not configured."
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/whiskr-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/whiskr-build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          python3 - "$CERTIFICATE_PATH" <<'PY'
          import base64
          import os
          import sys

          destination = sys.argv[1]
          encoded = os.environ["MACOS_CERTIFICATE_P12"]

          with open(destination, "wb") as certificate:
              certificate.write(base64.b64decode(encoded))
          PY

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          {
            echo "WHISKR_KEYCHAIN=$KEYCHAIN_PATH"
            echo "WHISKR_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Sign macOS application
        shell: bash
        run: |
          set -euxo pipefail

          APP="$PWD/build/Whiskr.app"
          BINARY="$APP/Contents/Resources/whiskr_desktop"
          LAUNCHER="$APP/Contents/MacOS/Whiskr"

          if [[ -n "$MACOS_APPLICATION_IDENTITY" && \
                -n "${WHISKR_KEYCHAIN:-}" ]]; then
            codesign \
              --force \
              --options runtime \
              --timestamp \
              --keychain "$WHISKR_KEYCHAIN" \
              --sign "$MACOS_APPLICATION_IDENTITY" \
              "$BINARY"

            codesign \
              --force \
              --options runtime \
              --timestamp \
              --keychain "$WHISKR_KEYCHAIN" \
              --sign "$MACOS_APPLICATION_IDENTITY" \
              "$LAUNCHER"

            codesign \
              --force \
              --deep \
              --options runtime \
              --timestamp \
              --keychain "$WHISKR_KEYCHAIN" \
              --sign "$MACOS_APPLICATION_IDENTITY" \
              "$APP"
          else
            echo "::warning::Creating an ad-hoc signed macOS application."

            codesign --force --sign - "$BINARY"
            codesign --force --sign - "$LAUNCHER"
            codesign --force --deep --sign - "$APP"
          fi

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP"

      - name: Build macOS installer
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          OUTPUT="$PWD/build/whiskr_${{ github.ref_name }}_darwin_universal.pkg"
          PKGROOT="$PWD/build/pkgroot"
          SCRIPTS="$PWD/build/pkg-scripts"
          COMPONENT="$PWD/build/whiskr-component.pkg"

          PKG_VERSION="$(
            python3 - "$VERSION" "$GITHUB_RUN_NUMBER" <<'PY'
          import re
          import sys

          version = sys.argv[1]
          fallback = sys.argv[2]

          match = re.match(r"^[0-9]+(?:\.[0-9]+)*", version)

          if match:
              print(match.group(0))
          else:
              print(f"0.0.{fallback}")
          PY
          )"

          rm -rf "$PKGROOT" "$SCRIPTS"
          mkdir -p "$PKGROOT" "$SCRIPTS"

          cp -a build/Whiskr.app "$PKGROOT/Whiskr.app"

          cat > "$SCRIPTS/preinstall" <<'PREINSTALL'
          #!/bin/sh
          set -e

          TARGET_VOLUME="${3:-/}"
          rm -rf "$TARGET_VOLUME/Applications/Whiskr.app"

          exit 0
          PREINSTALL

          chmod +x "$SCRIPTS/preinstall"

          pkgbuild \
            --root "$PKGROOT" \
            --scripts "$SCRIPTS" \
            --identifier io.github.coalaura.whiskr \
            --version "$PKG_VERSION" \
            --install-location /Applications \
            "$COMPONENT"

          if [[ -n "$MACOS_INSTALLER_IDENTITY" && \
                -n "${WHISKR_KEYCHAIN:-}" ]]; then
            productbuild \
              --keychain "$WHISKR_KEYCHAIN" \
              --sign "$MACOS_INSTALLER_IDENTITY" \
              --package "$COMPONENT" \
              "$OUTPUT"
          else
            echo "::warning::Creating an unsigned macOS installer."

            productbuild \
              --package "$COMPONENT" \
              "$OUTPUT"
          fi

          test -f "$OUTPUT"

      - name: Optionally notarize macOS installer
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$PWD/build/whiskr_${{ github.ref_name }}_darwin_universal.pkg"

          if [[ -z "$MACOS_APPLICATION_IDENTITY" || \
                -z "$MACOS_INSTALLER_IDENTITY" || \
                -z "$APPLE_ID" || \
                -z "$APPLE_APP_SPECIFIC_PASSWORD" || \
                -z "$APPLE_TEAM_ID" ]]; then
            echo "::warning::macOS notarization secrets are incomplete; skipping notarization."
            exit 0
          fi

          xcrun notarytool submit "$OUTPUT" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$OUTPUT"
          xcrun stapler validate "$OUTPUT"

      - name: Upload macOS desktop installer
        uses: actions/upload-artifact@v7
        with:
          name: whiskr_${{ github.ref_name }}_darwin_universal_desktop
          path: build/whiskr_${{ github.ref_name }}_darwin_universal.pkg
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs:
      - server
      - desktop_linux
      - desktop_windows
      - desktop_macos

    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: whiskr_*

      - name: Collect release files
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf dist
          mkdir -p dist

          copy_release_files() {
            local expected_count="$1"
            local pattern="$2"
            local files=()

            mapfile -d '' files < <(
              find artifacts \
                -type f \
                -name "$pattern" \
                -print0
            )

            echo "Pattern '$pattern': ${#files[@]} file(s)"

            if [[ "${#files[@]}" -ne "$expected_count" ]]; then
              echo "::error::Expected $expected_count file(s) matching '$pattern', found ${#files[@]}"
              printf '%s\n' "${files[@]}"
              return 1
            fi

            cp -v "${files[@]}" dist/
          }

          # Four server archives.
          copy_release_files \
            4 \
            "whiskr_${{ github.ref_name }}_*.tar.gz"

          # Two Linux desktop installers: amd64 and arm64.
          copy_release_files \
            2 \
            "whiskr_${{ github.ref_name }}_linux_*.AppImage"

          # Two Windows desktop installers: amd64 and arm64.
          copy_release_files \
            2 \
            "whiskr_${{ github.ref_name }}_windows_*_setup.exe"

          # One universal macOS desktop installer.
          copy_release_files \
            1 \
            "whiskr_${{ github.ref_name }}_darwin_universal.pkg"

          echo "Release contents:"
          ls -lah dist

          count="$(find dist -maxdepth 1 -type f | wc -l)"
          echo "Release files: $count"
          test "$count" -eq 9

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
