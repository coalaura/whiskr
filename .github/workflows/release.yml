name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            zig_target: x86_64-linux-musl
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            zig_target: aarch64-linux-musl
            runner: ubuntu-latest
          - goos: windows
            goarch: amd64
            zig_target: x86_64-windows-gnu
            runner: ubuntu-latest
          - goos: windows
            goarch: arm64
            zig_target: aarch64-windows-gnu
            runner: ubuntu-latest
      fail-fast: false

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Zig
      if: matrix.zig_target != ''
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2

    - name: Build Frontend
      run: |
        cd static
        bun install
        bun run build
        cd ..
        mv static/dist public

    - name: Generate Windows resources
      if: matrix.goos == 'windows'
      run: |
        go install github.com/tc-hib/go-winres@latest
        go-winres simply \
          --manifest cli \
          --product-name whiskr \
          --original-filename whiskr.exe \
          --icon public/favicon.ico \
          --copyright "(c) 2026 coalaura" \
          --file-description "Minimal LLM chat UI using OpenRouter giving you control over your context." \
          --file-version "${{ github.ref_name }}" \
          --arch "${{ matrix.goarch }}"

    - name: Build whiskr
      shell: bash
      run: |
        mkdir -p build
        EXT=""
        LDFLAGS=""

        [[ "${{ matrix.goos }}" == "windows" ]] && EXT=".exe" || EXT=""

        if [[ -n "${{ matrix.zig_target }}" ]]; then
          export CC="zig cc -target ${{ matrix.zig_target }}"
          export CXX="zig c++ -target ${{ matrix.zig_target }}"

          if [[ "${{ matrix.zig_target }}" == *"musl"* ]]; then
            LDFLAGS="-linkmode external -extldflags '-static'"
          fi
        fi

        GOOS=${{ matrix.goos }} \
        GOARCH=${{ matrix.goarch }} \
        CGO_ENABLED=1 \
        go build \
          -trimpath \
          -buildvcs=false \
          -ldflags "-s -w -X 'main.Version=${{ github.ref_name }}' $LDFLAGS" \
          -o "build/whiskr${EXT}" .

        GUI=""
        [[ "${{ matrix.goos }}" == "windows" ]] && GUI="-H windowsgui" || GUI=""

        GOOS=${{ matrix.goos }} \
        GOARCH=${{ matrix.goarch }} \
        CGO_ENABLED=1 \
        go build \
          -tags desktop \
          -trimpath \
          -buildvcs=false \
          -ldflags "-s -w -X 'main.Version=${{ github.ref_name }}' $LDFLAGS $GUI" \
          -o "build/whiskr_desktop${EXT}" .

    - name: Build proxy
      shell: bash
      run: |
        mkdir -p build
        [[ "${{ matrix.goos }}" == "windows" ]] && EXT=".exe" || EXT=""

        GOOS=${{ matrix.goos }} \
        GOARCH=${{ matrix.goarch }} \
        CGO_ENABLED=0 \
        go build \
          -trimpath \
          -buildvcs=false \
          -ldflags "-s -w" \
          -o "build/whiskr_proxy${EXT}" ./cmd/proxy

    - name: Package
      shell: bash
      run: |
        [[ "${{ matrix.goos }}" == "windows" ]] && EXT=".exe" || EXT=""

        mkdir -p build/server build/desktop

        cp "build/whiskr${EXT}" build/server/
        cp "build/whiskr_proxy${EXT}" build/server/
        cp -r public build/server/public
        cp -r prompts build/server/prompts
        cp example.config.yml build/server/config.yml

        cp "build/whiskr_desktop${EXT}" build/desktop/
        cp -r prompts build/desktop/prompts
        cp example.config.yml build/desktop/config.yml

        tar -czvf "build/whiskr_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" \
          -C build/server "whiskr${EXT}" "whiskr_proxy${EXT}" public prompts config.yml

        tar -czvf "build/whiskr_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}_desktop.tar.gz" \
          -C build/desktop "whiskr_desktop${EXT}" prompts config.yml

        rm -rf build/server build/desktop

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: whiskr_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}
        path: build/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Download all build artifacts
      uses: actions/download-artifact@v8
      with:
        path: ./build

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: ./build/**
        name: "Release ${{ github.ref_name }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
